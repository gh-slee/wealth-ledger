name: Core and Web acceptance checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-312-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-web.lock
            requirements-web-test.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-web-test.lock
      - name: Inventory pinned dependency licenses offline
        run: |
          mkdir -p work
          python scripts/dependency_inventory.py --python-lock requirements-web-test.lock --require-declared --output work/dependency-inventory.json
      - name: Check canonical documentation and source language
        run: python scripts/check_language.py
      - name: Check public worktree privacy
        run: python scripts/check_publication.py --worktree
      - name: Check public index privacy
        run: python scripts/check_publication.py --staged
      - name: Run isolated synthetic unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Generate synthetic offline reports with default policy
        run: python examples/demo.py --output work/demo-default
      - name: Verify explicit BTC cost proxy opt-in
        run: python examples/demo.py --output work/demo-proxy --btc-cost-policy bull_average_proxy

      - name: Verify Traditional Chinese reports
        run: python examples/demo.py --output work/demo-tc --locale zh-TW
      - name: Verify Simplified Chinese reports
        run: python examples/demo.py --output work/demo-sc --locale zh-CN

  docker-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      WEALTH_LEDGER_DOCKER_TEST: "1"
      WEALTH_LEDGER_EXPECT_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Verify synthetic image privacy, upgrade, crash, persistence and empty-volume restore
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_web_docker.py' -v

  browser-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-web-test.lock
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run check:source
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - name: Check generated API types
        run: |
          python scripts/export_web_schema.py --output work/web-schema.json
          frontend/node_modules/.bin/openapi-typescript work/web-schema.json -o work/web-schema.d.ts
          cmp frontend/src/lib/schema.d.ts work/web-schema.d.ts
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - name: Show bounded synthetic browser failure context
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path("frontend/test-results").glob("*/error-context.md"))[:4]:
              print(path.as_posix())
              print(path.read_text(encoding="utf-8")[:16384])
          PY

  parser-sdk-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build audited source distribution, core wheel and independent example
        run: |
          python -m venv .venv-build
          .venv-build/bin/python -m pip install -r requirements-build.lock
          .venv-build/bin/python -m build --no-isolation --outdir work/sdk-dist
          .venv-build/bin/python -m build --wheel --no-isolation examples/parser-plugin --outdir work/sdk-dist
      - name: Install and verify outside the source checkout
        run: |
          python -m venv .venv-sdk
          .venv-sdk/bin/python -m pip install -r requirements-web-test.lock
          .venv-sdk/bin/python -m pip install --no-index --no-deps work/sdk-dist/*.whl
          python scripts/check_packages.py --artifacts work/sdk-dist --python .venv-sdk/bin/python
      - name: Verify the plugin in an immutable source image
        run: |
          python scripts/docker_context.py --output work/sdk-image-context
          docker build --tag wealth-ledger-sdk-base:test work/sdk-image-context
          python scripts/check_plugin_image.py --base-image wealth-ledger-sdk-base:test --wheel work/sdk-dist/wealth_ledger_synthetic_parser-0.1.0-py3-none-any.whl


  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      WEALTH_LEDGER_PG_TEST: "1"
      WEALTH_LEDGER_PG_TEST_CONFIG: work/pg-ci/test-config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-web.lock
            requirements-web-test.lock
            requirements-pg.lock
            requirements-pg-test.lock
      - name: Install exact optional operator/test dependencies
        run: python -m pip install -r requirements-pg-test.lock
      - name: Inventory optional dependency notices
        run: |
          mkdir -p work
          python scripts/dependency_inventory.py --python-lock requirements-pg-test.lock --require-declared --output work/pg-dependency-inventory.json
      - name: Create a fresh synthetic PostgreSQL18 environment
        run: python scripts/postgres.py test-environment --output work/pg-ci
      - name: Verify real SQL precision, privileges, races, jobs and double empty restore
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_postgres_*.py' -v
      - name: Build the explicit source-only PG runtime profile
        run: |
          python scripts/docker_context.py --output work/pg-runtime-context
          docker build --build-arg WEALTH_LEDGER_POSTGRES=1 --tag wealth-ledger-pg-ci:test work/pg-runtime-context
      - name: Verify nonroot runtime-role candidate roundtrip in the optional image
        env:
          WEALTH_LEDGER_PG_RUNTIME_IMAGE: wealth-ledger-pg-ci:test
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_postgres_packaging.py' -v
      - name: Remove only recorded synthetic resources
        if: always()
        run: |
          if test -f work/pg-ci/test-config.json; then
            python scripts/postgres.py cleanup-test-environment --config work/pg-ci/test-config.json
          fi
